<style>
:root{--bg:#0b0a10;--surf:#15131d;--gold:#e0b552;--dim:#8a8398;--txt:#ece8f1;--line:#2a2438}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding:16px 16px 56px;line-height:1.45;max-width:440px;margin:0 auto}
h1{font-size:1.4rem;color:var(--gold);font-weight:800}
.sub{color:var(--dim);font-size:12px;margin:6px 0 12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.row{display:flex;flex-direction:column;gap:8px}
button,.btn{border:0;border-radius:10px;padding:12px 16px;min-height:44px;width:100%;font-weight:700;cursor:pointer;background:var(--gold);color:#111;font-size:15px;transition:transform 220ms ease-out,opacity 220ms ease-out}
button.sec{background:#1c1826;color:var(--txt);border:1px solid var(--line)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default;pointer-events:none;transform:none}
.bar{height:8px;background:#1c1826;border-radius:8px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:#f472b6;width:0;transition:width 220ms ease-out}
.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#1c1826;font-size:11px;color:var(--dim);margin:2px}
#app{transition:opacity 220ms ease-out}
#out{font-size:13px;margin-top:8px;white-space:pre-wrap}
a{color:var(--gold)}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:24px;line-height:1.6}
